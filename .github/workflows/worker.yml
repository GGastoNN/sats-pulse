name: Payment Worker

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "backend/worker/**"
      - ".github/workflows/worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend/worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required GitHub secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECIPIENT: ${{ secrets.RECIPIENT_LIGHTNING_ADDRESS }}
          ORDER_SECRET: ${{ secrets.ORDER_SIGNING_SECRET }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$RECIPIENT" || { echo "Missing RECIPIENT_LIGHTNING_ADDRESS"; exit 1; }
          test -n "$ORDER_SECRET" || { echo "Missing ORDER_SIGNING_SECRET"; exit 1; }

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate Worker syntax
        run: node --check src/index.js && node --check src/catalog.js && node --check src/crypto.js

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure encrypted recipient secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECIPIENT: ${{ secrets.RECIPIENT_LIGHTNING_ADDRESS }}
        run: printf '%s' "$RECIPIENT" | npx wrangler secret put RECIPIENT_LIGHTNING_ADDRESS

      - name: Configure order signing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDER_SECRET: ${{ secrets.ORDER_SIGNING_SECRET }}
        run: printf '%s' "$ORDER_SECRET" | npx wrangler secret put ORDER_SIGNING_SECRET

      - name: Configure Speed API key when available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPEED_KEY: ${{ secrets.SPEED_API_KEY }}
        run: |
          if [ -n "$SPEED_KEY" ]; then
            printf '%s' "$SPEED_KEY" | npx wrangler secret put SPEED_API_KEY
            echo "Speed checkout mode is available."
          else
            echo "SPEED_API_KEY not set: Worker will fall back to direct Lightning Address invoices."
          fi
